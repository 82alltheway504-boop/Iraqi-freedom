<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Task Force Talon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3322"/><stop offset="1" stop-color="#12160f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4b77e"/><stop offset="1" stop-color="#a88b56"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- horizon and dunes -->
  <path d="M0 330 Q 128 296 256 322 T 512 306 L512 512 L0 512Z" fill="url(#sand)"/>
  <path d="M0 372 Q 150 344 300 368 T 512 352 L512 512 L0 512Z" fill="#8f7548" opacity=".55"/>
  <!-- sun -->
  <circle cx="368" cy="176" r="54" fill="#e3c26a" opacity=".9"/>
  <circle cx="368" cy="176" r="76" fill="#e3c26a" opacity=".16"/>
  <!-- tank silhouette, viewed from the side, facing left -->
  <g fill="#1b2015">
    <rect x="104" y="352" width="248" height="40" rx="14"/>
    <rect x="120" y="314" width="176" height="44" rx="12"/>
    <rect x="96" y="322" width="96" height="15" rx="7"/>
    <circle cx="140" cy="392" r="22"/><circle cx="196" cy="392" r="22"/>
    <circle cx="252" cy="392" r="22"/><circle cx="308" cy="392" r="22"/>
  </g>
  <g fill="#3d4732">
    <rect x="112" y="358" width="232" height="12" rx="6"/>
    <rect x="128" y="320" width="160" height="11" rx="5"/>
  </g>
  <!-- command chevrons -->
  <g fill="none" stroke="#e3c26a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 208 L216 166 L262 208"/>
    <path d="M170 262 L216 220 L262 262" opacity=".6"/>
  </g>
</svg>
