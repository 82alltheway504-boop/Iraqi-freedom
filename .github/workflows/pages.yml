# Publishes the game to GitHub Pages on every push.
#
# This deploys by pushing the built site to the `gh-pages` branch rather than
# using the Pages deployment API. The API route needs the Actions token to be
# able to create the Pages site, which it is not permitted to do here
# ("Resource not accessible by integration"), whereas pushing a branch only
# needs `contents: write` — which it has. Pushing a gh-pages branch to a public
# repository also provisions Pages on its own, so this works from a cold start
# with no repository settings touched by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/iraq-strategy-game-prototype-bfw74g]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        # Ship only what the game loads at runtime — no tests, no tooling, no
        # git history. The whole thing is a few hundred kilobytes of text.
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest sw.js _site/
          cp icon.svg icon-180.png icon-512.png icon-maskable.png _site/
          cp -r src _site/
          touch _site/.nojekyll
          echo "Deploying $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - name: Verify nothing depends on being at the domain root
        # A Pages project site serves from /<repo>/, so an absolute path would
        # silently 404 there while working perfectly in local testing.
        run: |
          if grep -rnE '(src|href)="/[^/]' _site --include='*.html' --include='*.js' --include='*.css'; then
            echo "::error::Found an absolute path; Pages serves this app from a subdirectory."
            exit 1
          fi
          echo "All paths are relative."

      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7}

          Runtime-only build. All paths are relative so the site works from the
          project subpath."
          git push --force --quiet \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
